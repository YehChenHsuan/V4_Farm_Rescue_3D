<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Farm Rescue 3D · 牧場救援大冒險 (V4 3D ESL Game)</title>
  <meta name="description" content="ALICE ESL V4 Lesson 4 專屬 3D 互動牧場救援英語遊戲，結合視覺數量計數、問答句型與分組合作教學。">
  <link rel="icon" href="data:,">
  
  <!-- 外部樣式表與 Google Fonts -->
  <link rel="stylesheet" href="style.css">
  
  <!-- 外部動畫與特效庫 (Canvas Confetti, GSAP) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>

  <!-- 全螢幕 3D 畫布容器 -->
  <div id="scene-container"></div>
  <div id="viewport-fx"></div>

  <!-- 主機級 3D 遊戲 HUD 覆蓋層 -->
  <div class="game-hud">
    
    <!-- 頂部導航狀態列 -->
    <header class="hud-header">
      <!-- 品牌標題 -->
      <div class="hud-brand hud-interactive">
        <span class="brand-icon">🚜</span>
        <div class="brand-title">FARM RESCUE 3D</div>
        <span class="brand-sub">V4 · p.10–11</span>
      </div>

      <!-- 中央題目問題橫幅 -->
      <div class="hud-question-capsule hud-interactive" id="question-capsule">
        <div class="question-text" id="question-text">How many animals do you see?</div>
        <button class="question-replay-btn" id="btn-replay-question">
          <span>📢 聽題目 (R)</span>
        </button>
      </div>

      <!-- 右側題目進度與控制群組 -->
      <div class="hud-controls-group hud-interactive">
        <div class="hud-pill highlight" id="progress-pill">救援進度 1 / 8</div>
        <button class="hud-btn" id="btn-mute" title="語音開關">♫</button>
        <button class="hud-btn" id="btn-pause" title="暫停遊戲">Ⅱ</button>
        <button class="hud-btn" id="btn-fullscreen" title="全螢幕切換">⛶</button>
      </div>
    </header>

    <!-- 隊伍計分展示欄 (2-4 隊動態切換) -->
    <div class="team-scoreboard hud-interactive" id="team-scoreboard">
      <!-- 由 JS 動態生成隊伍指示膠囊 -->
    </div>

    <!-- 底部操作區：3D 視角羅盤 + 巨大 3D 數字答案卡 + 教師跟讀確認列 -->
    <div class="hud-bottom-area">
      <!-- 視角羅盤 -->
      <div class="view-compass hud-interactive">
        <button class="compass-btn" id="btn-cam-left">↶ 轉向左</button>
        <button class="compass-btn" id="btn-cam-center">正面</button>
        <button class="compass-btn" id="btn-cam-right">右轉 ↷</button>
      </div>

      <!-- 中央巨大 3D 數字答案卡 -->
      <div class="answers-container hud-interactive" id="answers-deck">
        <!-- 由 JS 動態生成 3 張巨型 3D 答案卡牌 -->
      </div>

      <!-- 右側教師跟讀確認欄 -->
      <div class="teacher-action-bar hud-interactive" id="teacher-bar" hidden>
        <button class="btn-confirm-speech" id="btn-speech-ok">老師確認：已跟讀 →</button>
        <button class="btn-skip-speech" id="btn-speech-skip">跳過跟讀，先前進</button>
      </div>
    </div>

  </div>

  <!-- 回饋 Toast 特效 (答對 / 答錯) -->
  <div class="feedback-toast" id="feedback-toast">🎉 EXCELLENT! I see 3 cats.</div>

  <!-- 全螢幕遊戲彈跳視窗 (歡迎、暫停、結算) -->
  <div id="modal-overlay">
    <div class="game-modal" id="modal-content">
      <span class="modal-badge">ALICE ESL V4 ADVENTURE</span>
      <h2 class="modal-title">小小牧場，一起來救援！</h2>
      <p class="modal-desc">
        轉動立體牧場、點擊動物一起數一數！<br>
        各小隊派出代表按下正確數字，並大聲說出完整句：<br>
        <b>"I see... [number] [animals]!"</b>
      </p>

      <div class="settings-grid">
        <div class="setting-item">
          <label>模式選擇</label>
          <select class="setting-select" id="setting-mode">
            <option value="textbook">課本原題（8 組精選）</option>
            <option value="random">隨機練習（80 組擴展）</option>
          </select>
        </div>
        <div class="setting-item">
          <label>競賽隊伍</label>
          <select class="setting-select" id="setting-teams">
            <option value="2">2 隊（向日葵 / 小河）</option>
            <option value="3">3 隊（向日葵 / 小河 / 橡樹）</option>
            <option value="4">4 隊（四隊合作大挑戰）</option>
          </select>
        </div>
        <div class="setting-item">
          <label>挑戰題數</label>
          <select class="setting-select" id="setting-rounds">
            <option value="8">8 題 · 完整單元</option>
            <option value="4">4 題 · 快速熱身</option>
            <option value="16">16 題 · 深度挑戰</option>
          </select>
        </div>
        <div class="setting-item">
          <label>提示等級</label>
          <select class="setting-select" id="setting-hints">
            <option value="show">顯示英文題目看板</option>
            <option value="hide">聽力挑戰（隱藏看板文字）</option>
          </select>
        </div>
      </div>

      <button class="btn-start-game" id="btn-start-play">出發，拯救牧場動物 →</button>
    </div>
  </div>

  <script type="module" src="game.js"></script>
</body>
</html>
